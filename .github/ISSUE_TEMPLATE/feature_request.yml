name: ✨ Feature Request
description: Suggest an idea or enhancement for CoursePal
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Have an idea to make CoursePal better? Let us know below!
  - type: textarea
    id: problem
    attributes:
      label: Problem / Use Case
      description: What challenge or use case does this solve?
      placeholder: "When planning my semester, I want to..."
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: Describe your proposed feature or enhancement.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Any alternative solutions or workarounds you've thought about.
  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      description: Screenshots, mockups, or extra context.
